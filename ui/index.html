<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review Agent</title>
    <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
<div class="app-layout">

    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <h1>🤖 Code Review Agent</h1>
            <span class="subtitle">Autonomous &bull; Memory-aware &bull; ReAct loop</span>
        </div>
        <div class="header-right">
            <div id="health-badge" class="badge">checking...</div>
            <span id="uptime" class="uptime"></span>
        </div>
    </header>

    <!-- Three-column layout -->
    <div class="main-columns">

        <!-- LEFT: Input Panel -->
        <aside class="panel panel-left">
            <h2>Review Setup</h2>

            <div class="form-group">
                <label>Repository URL <span class="required">*</span></label>
                <input type="text" id="repo-url"
                    placeholder="https://github.com/pallets/flask">
            </div>

            <div class="form-group">
                <label>Specific files
                    <span class="hint">(absolute paths, one per line, or leave empty)</span>
                </label>
                <textarea id="files-input" rows="4"
                    placeholder="C:\projects\app\src\auth.py&#10;Leave empty to auto-detect"></textarea>
            </div>

            <div class="form-row">
                <label class="inline-label">
                    Max files:
                    <input type="number" id="max-files" value="2" min="1" max="5">
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="use-memory" checked>
                    <span>Neo4j memory</span>
                </label>
            </div>

            <div class="button-group">
                <button id="stream-btn" onclick="startStreamingReview()">&#9654; Start Review (Live)</button>
                <button id="stop-btn" onclick="stopReview()" disabled class="btn-secondary">&#9632; Stop</button>
            </div>

            <!-- Session history -->
            <div class="session-history">
                <h3>Recent Sessions</h3>
                <div id="session-list"></div>
            </div>
        </aside>

        <!-- CENTER: Live Agent Trace -->
        <main class="panel panel-center">
            <div class="panel-header">
                <h2>Agent Trace</h2>
                <span id="trace-status" class="trace-status status-waiting">Waiting...</span>
            </div>
            <div id="agent-trace" class="agent-trace">
                <div class="trace-placeholder">
                    Start a review to see the agent reasoning in real time.
                </div>
            </div>
        </main>

        <!-- RIGHT: Issues + Memory -->
        <aside class="panel panel-right">

            <div class="right-section">
                <div class="panel-header">
                    <h2>Issues Found</h2>
                    <span id="issue-count" class="badge badge-count">0</span>
                </div>
                <div id="issues-live" class="issues-live">
                    <p class="placeholder-text">Issues appear here as the agent finds them.</p>
                </div>
            </div>

            <div class="right-section">
                <div class="panel-header">
                    <h3>🧠 Graph Memory</h3>
                    <button onclick="loadMemoryStats()" class="btn-sm">&#x21BB;</button>
                </div>
                <div id="memory-stats" class="memory-stats">
                    <p class="placeholder-text">Loading...</p>
                </div>
            </div>

            <div id="session-summary" class="right-section hidden">
                <h3>Session Summary</h3>
                <div id="summary-content"></div>
            </div>

        </aside>
    </div>
</div>
<script src="ui/app.js"></script>
</body>
</html>
